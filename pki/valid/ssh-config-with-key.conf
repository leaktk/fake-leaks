# SSH Configuration File
# Metadata: label=SSH config with embedded private key, type=ssh_config, context=SSH configuration, generator=manual

Host prod-server
    HostName prod.example.com
    User deployer
    Port 22
    IdentityFile ~/.ssh/id_ed25519
    StrictHostKeyChecking yes

Host bastion
    HostName bastion.internal.example.com
    User admin
    # Embedded key (bad practice but happens in testing)
    IdentityAgent SSH_AUTH_SOCK

# WARNING: Never embed private keys in config files!
# Example of what NOT to do:
# -----BEGIN OPENSSH PRIVATE KEY-----
# b3BlbnNzaC1rZXktdjEAAAAABG5vbmUAAAAEbm9uZQAAAAAAAAABAAAAMwAAAAtzc2gtZW
# QyNTUxOQAAACAH5iJ6kL7mN8oP6qR7sT8uV9wX0yZ1aB2cD3eF4gAAAAAAJgFxY5wBcWO
# cAAAAAtzc2gtZWQyNTUxOQAAACAH5iJ6kL7mN8oP6qR7sT8uV9wX0yZ1aB2cD3eF4gAAAA
# EDf4G1h2I3j4K5l6M7n8O9p0Q1r2S3t4U5v6W7x8Y9z0Af4G1h2I3j4K5l6M7n8O9p0Q1r
# -----END OPENSSH PRIVATE KEY-----

Host github.com
    HostName github.com
    User git
    IdentityFile ~/.ssh/id_rsa_github
    IdentitiesOnly yes
